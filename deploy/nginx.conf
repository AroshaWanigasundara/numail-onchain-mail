# Nginx reverse-proxy configuration for NuMail (TanStack Start + node-server)
# Place this file in /etc/nginx/sites-available/numail and symlink it from sites-enabled.

upstream numail_node {
    # The Node server started by `bun start` / `node .output/server/index.mjs`.
    # Adjust the port if you run the app on a different PORT.
    server 127.0.0.1:3000;

    # Increase the keepalive pool so nginx reuses connections to Node.
    keepalive 32;
}

# Redirect all HTTP traffic to HTTPS (optional but recommended).
server {
    listen 80;
    server_name numail.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name numail.example.com;

    # SSL certificate paths (replace with your own from Let's Encrypt / your provider).
    ssl_certificate     /etc/letsencrypt/live/numail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/numail.example.com/privkey.pem;

    # Security hardening headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip the responses TanStack Start does not already compress.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json;

    # Static assets are served by the Node/Nitro server, but you can let nginx
    # handle them directly for better throughput. If you do, keep the
    # cache-busted asset URLs working by proxying anything else to Node.
    location /assets/ {
        # Example direct static serving (uncomment and adjust root if desired):
        # root /var/www/numail/.output/public;
        # expires 1y;
        # access_log off;

        # Default: proxy everything to the Node app.
        proxy_pass http://numail_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /favicon.ico {
        proxy_pass http://numail_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location /robots.txt {
        proxy_pass http://numail_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Proxy every other request to the TanStack Start SSR server.
    location / {
        proxy_pass http://numail_node;
        proxy_http_version 1.1;

        # WebSocket support (not required for this app, but harmless to include).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generous enough for SSR + server functions.
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
